name: BrakeBench CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt
      - name: C11 warnings-as-errors build
        run: cmake -S . -B build -DCMAKE_C_COMPILER=clang && cmake --build build
      - name: C unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Python syntax/format gate
        run: python -m compileall -q sim tests tools
      - name: DBC virtual-CAN SIL tests and evidence
        run: BRAKEBENCH_RUNNER=$PWD/build/brake_ecu_runner python -m pytest -p no:cacheprovider tests/python -q --junitxml=build/pytest.xml && python tools/generate_validation_report.py --junit build/pytest.xml
